server:
  port: 8095

spring:
  application:
    name: patrubki-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/your_db
    username: your_username
    password: your_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: substitute

# Folder with arial.ttf / arialbd.ttf / ariali.ttf / arialbi.ttf (optional).
# If empty: classpath:fonts/arial/, then C:/Windows/Fonts, then Linux msttcorefonts.
jasper:
  fonts:
    arial-dir:
